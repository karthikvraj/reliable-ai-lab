name: Generate requested activity (one time)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/generate-activity-once.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requested-synthetic-activity-import
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'karthikvraj/reliable-ai-lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Generate and import activity while preserving project files
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import urllib.request
          
          SOURCE_COMMIT = "1d195079df2d43dabaab38c72ce316ea55a04e07"
          SOURCE_URL = f"https://raw.githubusercontent.com/Shpota/github-activity-generator/{SOURCE_COMMIT}/contribute.py"
          SOURCE_SHA256 = "d02fdf288c0df7f96f804bb5c310779fda18fec26834b424f98cb02062e3f5c4"
          MARKER = "synthetic-activity-import-2026-10-05"
          AUTHOR_NAME = "karthikvraj"
          AUTHOR_EMAIL = "69818951+karthikvraj@users.noreply.github.com"
          
          def git(*args, cwd=None):
              return subprocess.check_output(["git", *args], cwd=cwd, text=True).strip()
          
          git("fetch", "origin", "main")
          git("checkout", "-B", "main", "origin/main")
          if git("log", "--format=%B", "--fixed-strings", f"--grep={MARKER}", "-1"):
              print("This requested activity import has already completed; nothing to do.")
              sys.exit(0)
          
          before = git("rev-parse", "HEAD")
          before_tree = git("rev-parse", "HEAD^{tree}")
          git("config", "user.name", AUTHOR_NAME)
          git("config", "user.email", AUTHOR_EMAIL)
          assert not git("status", "--porcelain"), "Working tree must be clean"
          
          with tempfile.TemporaryDirectory(prefix="requested-activity-") as temp:
              root = Path(temp)
              with urllib.request.urlopen(SOURCE_URL, timeout=30) as response:
                  source = response.read()
              assert hashlib.sha256(source).hexdigest() == SOURCE_SHA256, "Upstream checksum mismatch"
              script = root / "contribute.py"
              script.write_bytes(source)
              with (root / "generation.log").open("w") as output:
                  subprocess.run([
                      sys.executable, str(script), "--days_before=365", "--days_after=0",
                      "--frequency=80", "--max_commits=10",
                      f"--user_name={AUTHOR_NAME}", f"--user_email={AUTHOR_EMAIL}",
                  ], cwd=root, stdout=output, stderr=subprocess.STDOUT, check=True)
              repositories = list(root.glob("repository-*"))
              assert len(repositories) == 1, "Expected one generated repository"
              generated = repositories[0]
              count = int(git("rev-list", "--count", "HEAD", cwd=generated))
              assert 1 <= count <= 3650, f"Unexpected commit count: {count}"
              assert git("ls-tree", "--name-only", "HEAD", cwd=generated) == "README.md"
              lines = [line for line in (generated / "README.md").read_text().splitlines() if line]
              assert len(lines) == count, "Not every generated contribution was committed"
              dates = git("log", "--format=%aI", cwd=generated).splitlines()
              active_days = len({date[:10] for date in dates})
              git("fsck", "--full", cwd=generated)
              git("fetch", str(generated), "main")
              generated_tip = git("rev-parse", "FETCH_HEAD")
              message = (
                  f"Import synthetic contribution activity [{MARKER}]\n\n"
                  f"Generated by Shpota/github-activity-generator at {SOURCE_COMMIT}.\n"
                  f"{count} synthetic commits across {active_days} days; defaults: "
                  "365 prior days, frequency 80, maximum 10 commits/day.\n"
                  "These commits are generated activity, not project development.\n"
                  "The existing project files and history are preserved by an ours merge."
              )
              git("merge", "--allow-unrelated-histories", "--strategy=ours", "--no-ff",
                  generated_tip, "-m", message)
              assert git("rev-parse", "HEAD^{tree}") == before_tree, "Project tree changed"
              subprocess.run(["git", "merge-base", "--is-ancestor", before, "HEAD"], check=True)
              assert int(git("rev-list", "--count", f"{before}..HEAD")) == count + 1
              assert not git("status", "--porcelain"), "Working tree changed"
              git("push", "origin", "HEAD:refs/heads/main")
              after = git("rev-parse", "HEAD")
              assert git("ls-remote", "origin", "refs/heads/main").split()[0] == after
              summary = (
                  f"Imported {count} synthetic commits across {active_days} days.\n\n"
                  f"Author dates: {min(dates)} through {max(dates)}.\n\n"
                  f"Before: `{before}`\n\nAfter: `{after}`\n\n"
                  f"Source: `{SOURCE_COMMIT}`\n\n"
                  "Verified: project tree unchanged, original history retained, ordinary "
                  "fast-forward push, no force push.\n"
              )
              print(summary)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
                  output.write(summary)
